<svg width="1200" height="560" viewBox="0 0 1200 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Language and AI stack banners</title>
  <desc id="desc">A dark 3D-style board with language banners for TypeScript, Python, JavaScript, Swift, and Shell, plus AI stack tiles for Codex, Claude, OpenCode, Supabase, and Vercel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#060A12"/>
      <stop offset="0.5" stop-color="#0C1220"/>
      <stop offset="1" stop-color="#07120E"/>
    </linearGradient>
    <linearGradient id="rim" x1="96" y1="68" x2="1104" y2="492" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6"/>
      <stop offset="0.5" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#FACC15"/>
    </linearGradient>
    <linearGradient id="ts" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38BDF8"/><stop offset="1" stop-color="#2563EB"/></linearGradient>
    <linearGradient id="py" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3776AB"/><stop offset="1" stop-color="#FFD43B"/></linearGradient>
    <linearGradient id="js" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F7DF1E"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
    <linearGradient id="swift" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F97316"/><stop offset="1" stop-color="#EF4444"/></linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#94A3B8"/><stop offset="1" stop-color="#22C55E"/></linearGradient>
    <filter id="shadow" x="-25%" y="-40%" width="150%" height="190%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.48"/>
    </filter>
    <filter id="glow" x="-40%" y="-50%" width="180%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.10 0 0 0 0 0.75 0 0 0 0 0.55 0 0 0 0.32 0"/>
      <feBlend in="SourceGraphic" mode="screen"/>
    </filter>
    <style>
      .title { font-family: Inter, Segoe UI, Arial, sans-serif; font-weight: 900; letter-spacing: 0; }
      .copy { font-family: Inter, Segoe UI, Arial, sans-serif; font-weight: 650; letter-spacing: 0; }
      .mono { font-family: Fira Code, SFMono-Regular, Consolas, monospace; font-weight: 800; letter-spacing: 0; }
    </style>
  </defs>

  <rect width="1200" height="560" rx="32" fill="url(#bg)"/>
  <rect x="22" y="22" width="1156" height="516" rx="28" stroke="#263244" stroke-width="2"/>
  <path d="M82 446C216 354 335 404 452 319C550 248 642 135 762 170C876 203 900 365 1040 272" stroke="url(#rim)" stroke-width="3" stroke-opacity="0.45" filter="url(#glow)"/>
  <path d="M76 142H1124M76 280H1124M76 418H1124" stroke="#1F2937" stroke-dasharray="7 11"/>

  <text x="70" y="80" fill="#F8FAFC" class="title" font-size="34">stack banners</text>
  <text x="70" y="110" fill="#94A3B8" class="copy" font-size="17">languages I ship with, AI tools I build beside</text>

  <g filter="url(#shadow)">
    <g transform="translate(70 154)">
      <rect width="196" height="96" rx="22" fill="#0D1117" stroke="#334155" stroke-width="2"/>
      <rect x="0" y="66" width="196" height="30" rx="0" fill="#05070B" opacity="0.68"/>
      <rect x="22" y="20" width="56" height="56" rx="14" fill="url(#ts)"/>
      <text x="38" y="58" fill="#FFFFFF" class="title" font-size="25">TS</text>
      <text x="96" y="43" fill="#F8FAFC" class="title" font-size="22">TypeScript</text>
      <text x="96" y="68" fill="#93C5FD" class="mono" font-size="13">typed ui</text>
    </g>
    <g transform="translate(288 154)">
      <rect width="196" height="96" rx="22" fill="#0D1117" stroke="#334155" stroke-width="2"/>
      <rect x="0" y="66" width="196" height="30" rx="0" fill="#05070B" opacity="0.68"/>
      <rect x="22" y="20" width="56" height="56" rx="14" fill="url(#py)"/>
      <circle cx="42" cy="42" r="12" fill="#FFFFFF" opacity="0.92"/>
      <circle cx="58" cy="56" r="12" fill="#0D1117" opacity="0.82"/>
      <text x="96" y="43" fill="#F8FAFC" class="title" font-size="22">Python</text>
      <text x="96" y="68" fill="#FDE68A" class="mono" font-size="13">agents</text>
    </g>
    <g transform="translate(506 154)">
      <rect width="196" height="96" rx="22" fill="#0D1117" stroke="#334155" stroke-width="2"/>
      <rect x="0" y="66" width="196" height="30" rx="0" fill="#05070B" opacity="0.68"/>
      <rect x="22" y="20" width="56" height="56" rx="14" fill="url(#js)"/>
      <text x="40" y="58" fill="#111827" class="title" font-size="24">JS</text>
      <text x="96" y="43" fill="#F8FAFC" class="title" font-size="22">JavaScript</text>
      <text x="96" y="68" fill="#FEF08A" class="mono" font-size="13">web glue</text>
    </g>
    <g transform="translate(724 154)">
      <rect width="196" height="96" rx="22" fill="#0D1117" stroke="#334155" stroke-width="2"/>
      <rect x="0" y="66" width="196" height="30" rx="0" fill="#05070B" opacity="0.68"/>
      <rect x="22" y="20" width="56" height="56" rx="14" fill="url(#swift)"/>
      <path d="M40 37C52 52 65 58 76 59C62 65 48 61 36 52C44 62 55 69 70 72C52 76 35 68 27 55C37 61 47 63 57 61C47 56 38 48 31 37C35 39 38 39 40 37Z" fill="#FFF7ED"/>
      <text x="96" y="43" fill="#F8FAFC" class="title" font-size="22">Swift</text>
      <text x="96" y="68" fill="#FDBA74" class="mono" font-size="13">native</text>
    </g>
    <g transform="translate(942 154)">
      <rect width="188" height="96" rx="22" fill="#0D1117" stroke="#334155" stroke-width="2"/>
      <rect x="0" y="66" width="188" height="30" rx="0" fill="#05070B" opacity="0.68"/>
      <rect x="22" y="20" width="56" height="56" rx="14" fill="url(#shell)"/>
      <text x="36" y="57" fill="#0B1220" class="title" font-size="25">$</text>
      <text x="96" y="43" fill="#F8FAFC" class="title" font-size="22">Shell</text>
      <text x="96" y="68" fill="#BBF7D0" class="mono" font-size="13">ops</text>
    </g>
  </g>

  <text x="70" y="315" fill="#F8FAFC" class="title" font-size="30">AI stack</text>
  <text x="70" y="342" fill="#94A3B8" class="copy" font-size="16">local agents, model interfaces, deploy surfaces</text>

  <g filter="url(#shadow)">
    <g transform="translate(70 366)">
      <rect width="196" height="104" rx="24" fill="#0D1117" stroke="#334155" stroke-width="2"/>
      <circle cx="51" cy="52" r="30" fill="#F8FAFC"/>
      <path d="M51 29C64 29 74 39 74 52C74 65 64 75 51 75C38 75 28 65 28 52C28 39 38 29 51 29ZM51 39C43.8 39 38 44.8 38 52C38 59.2 43.8 65 51 65C58.2 65 64 59.2 64 52C64 44.8 58.2 39 51 39Z" fill="#0D1117"/>
      <text x="96" y="45" fill="#F8FAFC" class="title" font-size="24">Codex</text>
      <text x="96" y="70" fill="#CBD5E1" class="mono" font-size="13">OpenAI</text>
    </g>
    <g transform="translate(288 366)">
      <rect width="196" height="104" rx="24" fill="#0D1117" stroke="#334155" stroke-width="2"/>
      <circle cx="51" cy="52" r="30" fill="#D97757"/>
      <path d="M38 66L51 31L64 66M43 56H59" stroke="#FFF7ED" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="96" y="45" fill="#F8FAFC" class="title" font-size="24">Claude</text>
      <text x="96" y="70" fill="#FED7AA" class="mono" font-size="13">Anthropic</text>
    </g>
    <g transform="translate(506 366)">
      <rect width="196" height="104" rx="24" fill="#0D1117" stroke="#334155" stroke-width="2"/>
      <rect x="22" y="22" width="58" height="58" rx="18" fill="#111827" stroke="#38BDF8" stroke-width="2"/>
      <text x="34" y="61" fill="#38BDF8" class="title" font-size="24">OC</text>
      <text x="96" y="45" fill="#F8FAFC" class="title" font-size="24">OpenCode</text>
      <text x="96" y="70" fill="#BAE6FD" class="mono" font-size="13">terminal AI</text>
    </g>
    <g transform="translate(724 366)">
      <rect width="196" height="104" rx="24" fill="#0D1117" stroke="#334155" stroke-width="2"/>
      <path d="M38 24H76L54 58C50 64 38 62 38 54V24Z" fill="#3ECF8E"/>
      <path d="M76 80H38L60 46C64 40 76 42 76 50V80Z" fill="#1F7A56"/>
      <text x="96" y="45" fill="#F8FAFC" class="title" font-size="24">Supabase</text>
      <text x="96" y="70" fill="#BBF7D0" class="mono" font-size="13">data layer</text>
    </g>
    <g transform="translate(942 366)">
      <rect width="188" height="104" rx="24" fill="#0D1117" stroke="#334155" stroke-width="2"/>
      <path d="M51 23L82 77H20L51 23Z" fill="#F8FAFC"/>
      <text x="96" y="45" fill="#F8FAFC" class="title" font-size="24">Vercel</text>
      <text x="96" y="70" fill="#E5E7EB" class="mono" font-size="13">deploy</text>
    </g>
  </g>

  <g transform="translate(70 506)">
    <rect width="1060" height="2" rx="1" fill="url(#rim)" opacity="0.65"/>
    <text x="0" y="30" fill="#64748B" class="mono" font-size="13">TypeScript / Python / JavaScript / Swift / Shell / Codex / Claude / OpenCode / Supabase / Vercel</text>
  </g>
</svg>
