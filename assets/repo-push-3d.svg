<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">3D repository push and commit viewer</title>
  <desc id="desc">An isometric contribution city with language chart, radar chart, and repository activity stats.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1200" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="0.58" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF2F7"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#93C5FD"/><stop offset="1" stop-color="#1D4ED8"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#BBF7D0"/><stop offset="1" stop-color="#15803D"/></linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FEF08A"/><stop offset="1" stop-color="#D97706"/></linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FBCFE8"/><stop offset="1" stop-color="#A21CAF"/></linearGradient>
    <linearGradient id="gray" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E5E7EB"/><stop offset="1" stop-color="#6B7280"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
