<svg width="1200" height="170" viewBox="0 0 1200 170" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Old account arrow callout</title>
  <desc id="desc">An aesthetic arrow pointing from the rebuilt account note to the old account screenshot.</desc>
  <defs>
    <linearGradient id="stroke" x1="170" y1="26" x2="1030" y2="135" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.55" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#FACC15"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.18 0 0 0 0 0.95 0 0 0 0 0.65 0 0 0 0.38 0"/>
      <feBlend in="SourceGraphic" mode="screen"/>
    </filter>
  </defs>
  <rect width="1200" height="170" rx="28" fill="#0D1117"/>
  <rect x="18" y="18" width="1164" height="134" rx="24" stroke="#263244" stroke-width="2"/>
  <text x="410" y="62" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="900">old account receipt below</text>
  <text x="386" y="92" fill="#8B949E" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">flagged account snapshot preserved so the rebuild has context</text>
  <path d="M254 116C372 138 484 127 570 107C676 82 764 78 930 111" stroke="url(#stroke)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M914 91L953 116L907 129" stroke="#FACC15" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
